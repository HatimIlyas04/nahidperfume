<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/nahid.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EF776A" />

    <!-- PWA: installable app shell, mainly so the admin can add Nahid
         Perfumes to their phone's home screen and enable order push
         notifications (see src/utils/pushNotifications.js). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nahid" />

    <!-- Opens the connection (DNS + TLS) to the backend and image CDN
         before any JS runs, instead of waiting for the first fetch() to
         start that handshake — shaves the connection-setup time off the
         very first API/image request, which matters most right after a
         cold Render start. -->
    <link rel="preconnect" href="https://nahidperfume-backend.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://nahidperfume-backend.onrender.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Arabic is the default language, so the Arabic typeface must be
         discoverable by the browser's preload scanner immediately, not
         injected by JS after React mounts (LanguageContext.jsx used to
         do that -- fine for an opt-in secondary language, too slow now
         that most first visits render in Arabic). Loaded as a non-blocking
         preload (swapped to an active stylesheet on load) instead of a
         plain <link rel="stylesheet">, which would otherwise be a
         render-blocking request to a third-party domain on every first
         paint — exactly the kind of cost this pass is trying to cut. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;500;600;700&display=swap" />
    </noscript>
